# ================================================================
# ZapIt — iOS IPA Build Pipeline
# GitHub Actions — buduje .ipa przez Capacitor + Xcode
#
# SETUP (jednorazowo):
#  1. Masz konto Apple Developer ($99/rok) lub użyj AltStore
#  2. W repo → Settings → Secrets dodaj:
#       BUILD_CERTIFICATE_BASE64  (cert .p12 jako base64)
#       P12_PASSWORD              (hasło do certyfikatu)
#       BUILD_PROVISION_PROFILE_BASE64 (profil .mobileprovision jako base64)
#       KEYCHAIN_PASSWORD         (dowolne hasło, np. "zapit123")
#       APPLE_TEAM_ID             (np. "X9AB123456")
#
#  Alternatywa BEZ konta Developer:
#  → Użyj AltStore / Sideloadly (patrz README.md)
# ================================================================

name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:          # uruchom ręcznie z GitHub UI

env:
  XCODE_VERSION: '15.4'
  NODE_VERSION:  '20'
  APP_NAME:      'ZapIt'
  BUNDLE_ID:     'com.zapit.app'

jobs:
  # ── 1. WEB BUILD ────────────────────────────────────────────
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      # Capacitor wymaga katalogu www/ z gotowym buildem
      - name: Create www output
        run: |
          mkdir -p www
          cp -r public/* www/

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: www/

  # ── 2. IOS BUILD ────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    needs: build-web
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node deps + Capacitor
        run: npm ci

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: www/

      # Sync web → iOS native project
      - name: Capacitor sync iOS
        run: npx cap sync ios

      # ── Code signing ──────────────────────────────────────
      - name: Install Apple certificate & provisioning profile
        env:
          CERT_B64:     ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASS:    ${{ secrets.P12_PASSWORD }}
          PP_B64:       ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KP:           ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KP_PATH=$RUNNER_TEMP/zapit.keychain-db

          echo -n "$CERT_B64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PP_B64"   | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KP" "$KP_PATH"
          security set-keychain-settings -lut 21600 "$KP_PATH"
          security unlock-keychain -p "$KP" "$KP_PATH"
          security import "$CERT_PATH" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KP_PATH"
          security list-keychain -d user -s "$KP_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      # ── Xcode Archive ─────────────────────────────────────
      - name: Build archive
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ZapIt.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            | xcpretty

      # ── Export IPA ────────────────────────────────────────
      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ZapIt.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ZapIt-IPA

      # ── Upload artifact ───────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZapIt-IPA
          path: ${{ runner.temp }}/ZapIt-IPA/*.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/zapit.keychain-db

  # ── 3. ALT-STORE SIDELOAD (BEZ KONTA APPLE) ─────────────────
  # Jeśli nie masz konta Developer, użyj alternatywy:
  #
  # Option A — AltStore / Sideloadly (na PC/Mac):
  #   1. Pobierz Sideloadly: https://sideloadly.io
  #   2. Podłącz iPhone USB
  #   3. Przeciągnij .ipa → Sideloadly → Install
  #   (ważne przez 7 dni z darmowym kontem Apple)
  #
  # Option B — TrollStore (iPhone z iOS 14-16.6.1):
  #   Nie wymaga konta Apple, działa permanentnie
  #   https://github.com/opa334/TrollStore
