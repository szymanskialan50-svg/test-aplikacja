name: Build iOS IPA

# ================================================================
# ZapIt — iOS IPA Build Pipeline
# ================================================================
# SETUP — jednorazowo w GitHub repo → Settings → Secrets:
#   BUILD_CERTIFICATE_BASE64       — plik .p12 zakodowany base64
#   P12_PASSWORD                   — hasło do certyfikatu .p12
#   BUILD_PROVISION_PROFILE_BASE64 — plik .mobileprovision base64
#   KEYCHAIN_PASSWORD              — dowolne, np. "zapit123"
#   APPLE_TEAM_ID                  — np. "X9AB123456"
#
# Jak zakodować pliki do base64:
#   macOS/Linux:  base64 -i cert.p12 | tr -d '\n'
#   Windows PS:   [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.p12"))
# ================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 — zbuduj web assets (Ubuntu, szybciej niż macOS)
  # ────────────────────────────────────────────────────────────
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm ci

      - name: Copy public → www
        run: |
          mkdir -p www
          cp -r public/* www/

      - name: Upload www
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: www/

  # ────────────────────────────────────────────────────────────
  # JOB 2 — zbuduj IPA na macOS
  # ────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    needs: build-web
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Xcode — latest-stable dostępny na runnerze
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node deps
        run: npm ci

      - name: Download web assets
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: www/

      # Capacitor — dodaj platformę iOS i zsynchronizuj
      - name: Capacitor add iOS + sync
        run: |
          npx cap add ios
          npx cap sync ios

      # ── Code signing ─────────────────────────────────────────
      - name: Install certificate & provisioning profile
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.P12_PASSWORD }}
          PP_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KP: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KP_PATH="$RUNNER_TEMP/zapit.keychain-db"

          # Dekoduj base64 — działa na macOS i Ubuntu
          printf '%s' "$CERT_B64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PP_B64"   | base64 --decode > "$PP_PATH"

          # Walidacja
          [ -s "$CERT_PATH" ] || { echo "BŁĄD: cert.p12 pusty — sprawdź secret BUILD_CERTIFICATE_BASE64"; exit 1; }
          [ -s "$PP_PATH"   ] || { echo "BŁĄD: profile pusty — sprawdź secret BUILD_PROVISION_PROFILE_BASE64"; exit 1; }

          # Utwórz i odblokuj keychain
          security create-keychain -p "$KP" "$KP_PATH"
          security set-keychain-settings -lut 21600 "$KP_PATH"
          security unlock-keychain -p "$KP" "$KP_PATH"

          # Importuj certyfikat
          security import "$CERT_PATH" \
            -P "$CERT_PASS" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KP_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Zezwól na dostęp bez UI prompt (krytyczne na CI)
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KP" "$KP_PATH"

          # Dodaj keychain do listy użytkownika
          security list-keychain -d user -s "$KP_PATH" login.keychain-db

          # Zainstaluj provisioning profile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Provisioning profile UUID: $UUID"

      # ── Xcode Archive ─────────────────────────────────────────
      - name: Build Xcode archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ZapIt.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            2>&1 | tee build.log

      # ── Export IPA ────────────────────────────────────────────
      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Plist musi być w osobnym pliku — GitHub nie podstawia secrets w heredoc
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZapIt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ZapIt-IPA"

      # ── Upload ────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapIt-IPA
          path: ${{ runner.temp }}/ZapIt-IPA/*.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/zapit.keychain-db" || true
